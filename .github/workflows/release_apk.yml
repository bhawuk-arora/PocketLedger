name: Build & Release APK

on:
  # Trigger on version tags like v1.0.0, v2.1.3, etc.
  push:
    tags:
      - 'v*'
    branches:
      - 'master'
      - 'main'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'New release build'

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pocketledger-frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Extract project version
        id: get_version
        run: |
          FULL_VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          VERSION_NAME=$(echo $FULL_VERSION | cut -d'+' -f1)
          VERSION_CODE="${{ github.run_number }}"
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION_NAME+$VERSION_CODE" >> $GITHUB_OUTPUT
          
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          else
            TAG_NAME="v$VERSION_NAME-build-$VERSION_CODE"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.get_version.outputs.VERSION_CODE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
          fi
          
          flutter build apk --release --split-per-abi --build-name=$VERSION_NAME --build-number=$VERSION_CODE
          
          mkdir -p build/app/outputs/apk_temp
          cp build/app/outputs/flutter-apk/*.apk build/app/outputs/apk_temp/
          
          flutter build apk --release --build-name=$VERSION_NAME --build-number=$VERSION_CODE
          
          cp build/app/outputs/apk_temp/*.apk build/app/outputs/flutter-apk/
          rm -rf build/app/outputs/apk_temp

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: pocketledger-frontend/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Pass metadata to release job
        run: |
          echo "${{ steps.get_version.outputs.TAG_NAME }}" > tag_name.txt
          echo "${{ steps.get_version.outputs.VERSION }}" > version.txt
      
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            tag_name.txt
            version.txt
          retention-days: 1

  release:
    name: Publish Official Release
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Only run this job if the push was a tag (official release)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: flutter-apk

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: build-metadata
          path: metadata

      - name: Read metadata
        id: meta
        run: |
          echo "TAG_NAME=$(cat metadata/tag_name.txt)" >> $GITHUB_OUTPUT
          echo "VERSION=$(cat metadata/version.txt)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: Bhawuk's Kharcha ${{ steps.meta.outputs.TAG_NAME }}
          body: |
            ## 🚀 Bhawuk's Kharcha - Performance & Personality 🔥
            
            **Version:** `${{ steps.meta.outputs.VERSION }}`
            **Build Number:** `${{ github.run_number }}`
            
            ### Downloads
            - **`app-arm64-v8a-release.apk`** — Modern phones (Fastest)
            - **`app-armeabi-v7a-release.apk`** — Older phones
            - **`app-release.apk`** — Universal build (Compatible everywhere)
            
            ### What's New
            ${{ github.event.inputs.release_notes || 'Official Release.' }}
            
            ---
            *Oye! Hissab-kitab rakho, Bhawuk da style vich!* 🫡
          files: |
            flutter-apk/app-arm64-v8a-release.apk
            flutter-apk/app-armeabi-v7a-release.apk
            flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
